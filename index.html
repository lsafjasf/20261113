<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海风调度 · 三风机供电挑战</title>
<style>
  html, body { margin: 0; background: #0b1620; color: #cfe3ef;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 10px; }
  canvas { background: #10202e; border-radius: 10px; max-width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,.5); }
  #hint { margin-top: 8px; font-size: 13px; color: #7fa3b8; text-align: center; line-height: 1.7; }
  #hint b { color: #ffd479; }
  kbd { background: #1d3446; border-radius: 4px; padding: 1px 6px; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">
    <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 选择风机 ·
    <kbd>←</kbd><kbd>→</kbd> 调整朝向 · <kbd>↑</kbd><kbd>↓</kbd> 调整桨距 ·
    <kbd>M</kbd> 声音 · <kbd>R</kbd> 重开<br>
    <b>目标</b>：120 秒内满足小镇用电。阵风来时<b>顺桨</b>（增大桨距角）保护机组，
    也别忘了限功率，别把电池冲爆！
  </div>
</div>
<script src="sim.js"></script>
<script>
"use strict";
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

// 固定地图：三台风机与小镇位置
const TURB_POS = [{ x: 190, y: 150 }, { x: 150, y: 300 }, { x: 230, y: 440 }];
const TOWN = { x: 770, y: 280 };

let state = Sim.createState();
let sel = 0;          // 当前选中的风机
let paused = false;
let muted = false;
const keys = {};
let bladeAngle = [0, 0, 0];
let lastTs = 0;

// ---------- 输入 ----------
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === "1") sel = 0;
  if (e.key === "2") sel = 1;
  if (e.key === "3") sel = 2;
  if (e.key === "m" || e.key === "M") muted = !muted;
  if (e.key === "r" || e.key === "R") restart();
  if (e.key === " ") paused = !paused;
  initAudio();
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });
cv.addEventListener("mousedown", (e) => {
  initAudio();
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / r.width);
  const my = (e.clientY - r.top) * (H / r.height);
  TURB_POS.forEach((p, i) => {
    if (Math.hypot(mx - p.x, my - p.y) < 46) sel = i;
  });
});

function restart() {
  state = Sim.createState();
  bladeAngle = [0, 0, 0];
  paused = false;
}

function readInputs() {
  const inputs = [{}, {}, {}];
  if (keys["ArrowLeft"])  inputs[sel].yawDelta = -1;
  if (keys["ArrowRight"]) inputs[sel].yawDelta = 1;
  if (keys["ArrowUp"])    inputs[sel].pitchDelta = -1; // 桨距变陡，多捕风
  if (keys["ArrowDown"])  inputs[sel].pitchDelta = 1;  // 顺桨，少捕风
  return inputs;
}

// ---------- 绘制 ----------
function drawSea(t) {
  const g = ctx.createLinearGradient(0, 46, 0, 470);
  g.addColorStop(0, "#14384e"); g.addColorStop(1, "#0d2737");
  ctx.fillStyle = g; ctx.fillRect(0, 46, W, 424);
  ctx.strokeStyle = "rgba(120,180,210,0.08)";
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    ctx.beginPath();
    const y0 = 80 + i * 50;
    for (let x = 0; x <= W; x += 20) {
      ctx.lineTo(x, y0 + Math.sin(x * 0.02 + t * 1.5 + i) * 5);
    }
    ctx.stroke();
  }
}

function drawFront(t) {
  const fp = Sim.frontAt(state.t);
  if (fp < 0) return;
  const x = fp * (W + 120) - 60;
  ctx.save();
  ctx.strokeStyle = "rgba(140,220,255,0.85)";
  ctx.fillStyle = "rgba(140,220,255,0.12)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  for (let y = 46; y <= 470; y += 12) ctx.lineTo(x + Math.sin(y * 0.05 + t * 3) * 8, y);
  ctx.stroke();
  ctx.lineTo(x - 46, 470); ctx.lineTo(x - 46, 46); ctx.closePath(); ctx.fill();
  // 冷锋三角齿
  ctx.fillStyle = "rgba(140,220,255,0.9)";
  for (let y = 60; y < 460; y += 28) {
    const fx = x + Math.sin(y * 0.05 + t * 3) * 8;
    ctx.beginPath();
    ctx.moveTo(fx, y); ctx.lineTo(fx + 16, y + 8); ctx.lineTo(fx, y + 16);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = "#9fdcff";
  ctx.font = "13px sans-serif";
  ctx.fillText("冷锋过境 · 阵风", Math.min(x + 20, W - 130), 66);
  ctx.restore();
}

function drawTownAndLines() {
  const demand = Sim.demandAt(state.t);
  const gen = state.turbines.reduce((s, t) => s + t.power, 0);
  const ratio = Math.max(0, Math.min(1, gen / Math.max(1, demand)));
  // 输电线：风机 -> 小镇，亮度随功率
  TURB_POS.forEach((p, i) => {
    const pw = state.turbines[i].power / Sim.RATED_KW;
    ctx.strokeStyle = "rgba(255,220,120," + (0.15 + pw * 0.75) + ")";
    ctx.lineWidth = 1.5 + pw * 2.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(TOWN.x - 60, TOWN.y); ctx.stroke();
  });
  // 小镇
  ctx.save();
  ctx.translate(TOWN.x, TOWN.y);
  ctx.fillStyle = "#233c4e";
  ctx.fillRect(-60, -70, 150, 130);
  ctx.strokeStyle = "rgba(150,200,225,0.4)"; ctx.strokeRect(-60, -70, 150, 130);
  const lit = ratio > 0.98 ? 1 : ratio;
  for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
    const on = ((r * 4 + c) / 12) < lit;
    ctx.fillStyle = on ? "#ffd479" : "#33475a";
    ctx.fillRect(-48 + c * 34, -58 + r * 40, 22, 26);
  }
  ctx.fillStyle = "#cfe9f7"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("小镇 需求 " + demand.toFixed(0) + " kW", 15, 78);
  ctx.restore();
}

function drawTopBar() {
  const demand = Sim.demandAt(state.t);
  const gen = state.turbines.reduce((s, t) => s + t.power, 0);
  ctx.fillStyle = "#0e1f2c"; ctx.fillRect(0, 0, W, 46);
  ctx.fillStyle = "#cfe9f7"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "left";
  const remain = Math.max(0, Sim.DURATION - state.t);
  ctx.fillText("剩余 " + remain.toFixed(0) + "s", 16, 29);
  ctx.fillStyle = gen >= demand ? "#7fe08c" : "#ff9c6b";
  ctx.fillText("发电 " + gen.toFixed(0) + " / 需求 " + demand.toFixed(0) + " kW", 130, 29);
  ctx.fillStyle = "#ff8f8f";
  ctx.fillText("供电缺口 " + state.gaps + " / " + Sim.MAX_GAPS, 360, 29);
  if (state.batteryHealth < 100) {
    ctx.fillStyle = "#ffb36b";
    ctx.fillText("电池健康 " + state.batteryHealth.toFixed(0) + "%", 520, 29);
  }
  if (paused && !state.over) {
    ctx.fillStyle = "#ffd479"; ctx.textAlign = "right";
    ctx.fillText("已暂停（空格继续）", W - 16, 29);
  }
}

function drawTimeline() {
  const x0 = 16, x1 = W - 16, y = 484, h = 16;
  ctx.fillStyle = "#0e1f2c"; ctx.fillRect(x0, y, x1 - x0, h);
  const tx = (t) => x0 + (t / Sim.DURATION) * (x1 - x0);
  Sim.PEAKS.forEach((p) => {
    ctx.fillStyle = "rgba(255,170,90,0.8)";
    ctx.fillRect(tx(p.t - p.w / 2), y, tx(p.t + p.w / 2) - tx(p.t - p.w / 2), h);
  });
  Sim.GUSTS.forEach((g) => {
    ctx.fillStyle = "rgba(120,210,255,0.8)";
    ctx.fillRect(tx(g.t0), y, tx(g.t1) - tx(g.t0), h);
  });
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(tx(state.t) - 1, y - 3, 2, h + 6);
  ctx.fillStyle = "#7fa3b8"; ctx.font = "11px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("橙=负荷高峰  蓝=阵风", x0, y + h + 13);
}

function drawPanels() {
  // 风机状态卡
  for (let i = 0; i < 3; i++) {
    const tb = state.turbines[i];
    const x = 16 + i * 218, y = 520, w = 206, h = 68;
    ctx.fillStyle = i === sel ? "#1b3a4f" : "#12293a";
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = i === sel ? "#ffd479" : "rgba(120,170,200,0.3)";
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = "#cfe9f7"; ctx.font = "12px sans-serif"; ctx.textAlign = "left";
    ctx.fillText("风机" + (i + 1) + "  桨距 " + tb.pitch.toFixed(0) + "°  朝向 " + tb.yaw.toFixed(0) + "°", x + 8, y + 17);
    ctx.fillText("转速 " + tb.rpm.toFixed(0) + "rpm  输出 " + tb.power.toFixed(1) + "kW", x + 8, y + 33);
    ctx.fillStyle = "#22394b"; ctx.fillRect(x + 8, y + 44, w - 16, 8);
    ctx.fillStyle = damageColor(tb.damage);
    ctx.fillRect(x + 8, y + 44, (w - 16) * (tb.damage / 100), 8);
    ctx.fillStyle = "#7fa3b8";
    ctx.fillText("损伤 " + tb.damage.toFixed(0) + "%", x + 8, y + 63);
  }
  // 电池
  const bx = 690, by = 520, bw = 254, bh = 68;
  ctx.fillStyle = "#12293a"; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = "rgba(120,170,200,0.3)"; ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = "#cfe9f7"; ctx.font = "12px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("电池 " + state.battery.toFixed(0) + "%", bx + 8, by + 17);
  ctx.fillStyle = "#22394b"; ctx.fillRect(bx + 8, by + 26, bw - 16, 12);
  const bc = state.battery > 40 ? "#7fe08c" : state.battery > 15 ? "#ffd479" : "#ff6b6b";
  ctx.fillStyle = bc; ctx.fillRect(bx + 8, by + 26, (bw - 16) * (state.battery / 100), 12);
  ctx.fillStyle = "#22394b"; ctx.fillRect(bx + 8, by + 46, bw - 16, 8);
  ctx.fillStyle = "#ff9c6b";
  ctx.fillRect(bx + 8, by + 46, (bw - 16) * (state.batteryHealth / 100), 8);
  ctx.fillStyle = "#7fa3b8";
  ctx.fillText("健康 " + state.batteryHealth.toFixed(0) + "%（过充会冲爆）", bx + 8, by + 66);
}

function drawWindCompass() {
  const cx = 70, cy = 105, wdir = Sim.windDirAt(state.t), ws = Sim.windSpeedAt(state.t);
  ctx.save();
  ctx.strokeStyle = "rgba(160,210,235,0.5)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI * 2); ctx.stroke();
  const a = (wdir * Math.PI) / 180;
  ctx.strokeStyle = "#8fd8ff"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(a) * 24, cy + Math.sin(a) * 24);
  ctx.lineTo(cx + Math.cos(a) * 24, cy - Math.sin(a) * 24);
  ctx.stroke();
  ctx.fillStyle = "#8fd8ff";
  ctx.beginPath();
  ctx.arc(cx + Math.cos(a) * 24, cy - Math.sin(a) * 24, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#cfe9f7"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("风 " + ws.toFixed(1) + " m/s", cx, cy + 48);
  ctx.restore();
}

function damageColor(d) {
  if (d < 30) return "#7fe08c";
  if (d < 65) return "#ffd479";
  return "#ff6b6b";
}

function drawTurbine(i, dt) {
  const p = TURB_POS[i], tb = state.turbines[i];
  bladeAngle[i] += tb.rpm * dt * 0.35;
  const yawA = (tb.yaw * Math.PI) / 180;
  ctx.save();
  ctx.translate(p.x, p.y);
  // 塔架
  ctx.strokeStyle = "#b9cfdd"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(0, 0); ctx.stroke();
  // 叶片（绕机舱旋转，转速反映输出）
  ctx.rotate(0);
  ctx.strokeStyle = tb.damage >= 100 ? "#5a6b76" : "#e8f4fb";
  ctx.lineWidth = 4; ctx.lineCap = "round";
  const nx = Math.cos(yawA) * 6, ny = -Math.sin(yawA) * 6;
  for (let b = 0; b < 3; b++) {
    const a = bladeAngle[i] + (b * Math.PI * 2) / 3;
    ctx.beginPath();
    ctx.moveTo(nx, ny);
    ctx.lineTo(nx + Math.cos(a) * 30, ny + Math.sin(a) * 30);
    ctx.stroke();
  }
  ctx.fillStyle = "#dfeef7";
  ctx.beginPath(); ctx.arc(nx, ny, 5, 0, Math.PI * 2); ctx.fill();
  // 朝向指示（机舱尾翼线）
  ctx.strokeStyle = "rgba(255,212,121,0.9)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.lineTo(-Math.cos(yawA) * 16, Math.sin(yawA) * 16); ctx.stroke();
  // 选中圈 + 损伤环
  if (i === sel) {
    ctx.strokeStyle = "#ffd479"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.arc(0, 6, 42, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.strokeStyle = damageColor(tb.damage); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 6, 36, -Math.PI / 2, -Math.PI / 2 + (tb.damage / 100) * Math.PI * 2); ctx.stroke();
  // 应力警告
  if (tb.stress > 0.02) {
    ctx.fillStyle = "rgba(255,80,80," + (0.5 + 0.5 * Math.sin(state.t * 12)) + ")";
    ctx.font = "bold 13px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("应力!", 0, -42);
  }
  ctx.fillStyle = "#cfe9f7"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("风机" + (i + 1) + " " + tb.power.toFixed(0) + "kW", 0, 46);
  ctx.restore();
}

// ---------- 声音：风声 + 发电嗡鸣，随风力与输出变化 ----------
let AC = null, windGain, windFilter, humOsc, humGain;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  const ACtor = window.AudioContext || window.webkitAudioContext;
  if (!ACtor) return;
  AC = new ACtor();
  const len = AC.sampleRate * 2;
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const noise = AC.createBufferSource();
  noise.buffer = buf; noise.loop = true;
  windFilter = AC.createBiquadFilter();
  windFilter.type = "bandpass"; windFilter.frequency.value = 400; windFilter.Q.value = 0.6;
  windGain = AC.createGain(); windGain.gain.value = 0;
  noise.connect(windFilter).connect(windGain).connect(AC.destination);
  noise.start();
  humOsc = AC.createOscillator();
  humOsc.type = "sawtooth"; humOsc.frequency.value = 70;
  humGain = AC.createGain(); humGain.gain.value = 0;
  humOsc.connect(humGain).connect(AC.destination);
  humOsc.start();
}
function updateAudio() {
  if (!AC) return;
  const ws = Sim.windSpeedAt(state.t);
  const gen = state.turbines.reduce((s, t) => s + t.power, 0);
  const m = muted || state.over ? 0 : 1;
  windGain.gain.setTargetAtTime(m * Math.pow(ws / 24, 2) * 0.4, AC.currentTime, 0.15);
  windFilter.frequency.setTargetAtTime(250 + ws * 45, AC.currentTime, 0.2);
  humGain.gain.setTargetAtTime(m * (gen / (Sim.RATED_KW * 3)) * 0.08, AC.currentTime, 0.1);
  humOsc.frequency.setTargetAtTime(55 + gen * 0.9, AC.currentTime, 0.1);
}

// ---------- 结算 ----------
function drawEnd() {
  ctx.fillStyle = "rgba(5,12,18,0.78)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = state.win ? "#7fe08c" : "#ff6b6b";
  ctx.font = "bold 42px sans-serif";
  ctx.fillText(state.win ? "供电成功！" : "供电失败", W / 2, H / 2 - 40);
  ctx.fillStyle = "#cfe9f7"; ctx.font = "18px sans-serif";
  const dmg = state.turbines.map((t) => t.damage.toFixed(0) + "%").join(" / ");
  ctx.fillText(state.win ? "小镇灯火通明，风机损伤：" + dmg : state.failReason, W / 2, H / 2 + 4);
  ctx.font = "15px sans-serif"; ctx.fillStyle = "#7fa3b8";
  ctx.fillText("按 R 重新开始", W / 2, H / 2 + 44);
}

// ---------- 主循环 ----------
function frame(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
  lastTs = ts;
  if (!paused && !state.over) {
    const inputs = readInputs();
    for (let k = 0; k < 3; k++) Sim.step(state, dt / 3, inputs);
  }
  ctx.clearRect(0, 0, W, H);
  drawSea(state.t);
  drawFront(state.t);
  drawTownAndLines();
  for (let i = 0; i < 3; i++) drawTurbine(i, state.over ? 0 : dt);
  drawWindCompass();
  drawTopBar();
  drawTimeline();
  drawPanels();
  updateAudio();
  if (state.over) drawEnd();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
