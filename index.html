<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>双舵沉箱 · 双人同屏合作</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: radial-gradient(circle at 50% 20%, #0e2436, #030a12 70%);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        color: #cfe0ea;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 22px;
        letter-spacing: 4px;
        color: #bff0ff;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 13px;
      }
      button {
        background: #14344c;
        color: #d7f1ff;
        border: 1px solid #2f6b8f;
        border-radius: 6px;
        padding: 7px 14px;
        cursor: pointer;
        font-size: 13px;
      }
      button:hover {
        background: #1d4a6b;
      }
      button.debug {
        border-color: #d8a23a;
        color: #ffd76b;
      }
      canvas {
        border: 1px solid #1f3f55;
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        background: #04101b;
        max-width: 96vw;
        height: auto;
      }
      .hint {
        font-size: 12px;
        color: #7fa3b8;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <h1>双舵沉箱</h1>
    <div class="toolbar">
      <button id="modeToggle">单人调试模式</button>
      <span id="modeLabel">双人合作（左 WASD · 右 方向键）</span>
      <span id="muteState">声音开</span>
    </div>
    <canvas id="game"></canvas>
    <div class="hint">空格 开始/暂停 · R 快速重开 · H 操作说明 · M 静音</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
